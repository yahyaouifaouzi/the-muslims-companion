name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up release signing
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=android/upload-keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build App Bundle
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v7
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev dpkg-dev

      - name: Build Linux release
        run: flutter build linux --release

      - name: Build .deb
        run: packaging/deb/build_deb.sh "${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@v7
        with:
          name: rafiq-amd64-deb
          path: build/*.deb

  # Windows is experimental: MSIX packaging is best-effort and must never
  # block the release. If it fails, Android/Linux artifacts still publish.
  build-windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Windows release
        run: flutter build windows --release

      - name: Build MSIX
        run: dart run msix:create

      - uses: actions/upload-artifact@v7
        with:
          name: rafiq-msix
          path: build/windows/x64/runner/Release/*.msix
          if-no-files-found: ignore

  publish:
    # Publish as long as the Android build succeeded, even if Windows (or
    # Linux) failed or was cancelled — only existing artifacts are attached.
    needs: [build-android, build-linux]
    if: ${{ !cancelled() && needs.build-android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/**
          generate_release_notes: true
